# Development, on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
# Open http://localhost:5173: Vite serves the SPA with hot reload and passes /api on to Django,
# which reloads itself on a change, as does the solver service. PostgreSQL is published on
# localhost for the backend's test suite. Caddy is left out.
services:
  caddy:
    profiles: [caddy]

  web:
    command: sh -c "python manage.py prepare && exec python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
    volumes:
      - ../backend:/app/backend
    networks: [public]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    volumes:
      - ../backend:/app/backend

  solver:
    command: >-
      uvicorn --factory solver_service.app:create_app --host 0.0.0.0 --port 8080 --log-config solver_service/logging.json
      --reload --reload-dir /app/solver
    volumes:
      - ../solver/nurse_roster:/app/solver/nurse_roster
      - ../solver/solver_service:/app/solver/solver_service

  db:
    networks: [public]
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"

  frontend:
    image: node:26-slim
    working_dir: /src
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    environment:
      VITE_API_PROXY: http://web:8000
    volumes:
      - ../frontend:/src
      - /src/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks: [public, frontend]
    depends_on:
      web:
        condition: service_healthy
