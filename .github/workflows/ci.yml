# The three suites and the image build, on every pull request and on main. A ticket branch runs here through its pull
# request (docs/guides/local-development.md, section 4.6); pushing main after the fast-forward runs it once more on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still going on the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages --python 3.14
      - name: The vendored suite and the service's contract tests
        working-directory: solver
        run: uv run --no-sync pytest -q

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: nurse_roster
          POSTGRES_USER: nurse_roster
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nurse_roster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages --python 3.14
      - name: Tests
        working-directory: backend
        run: uv run --no-sync pytest -q
      - name: Models and migrations agree
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: uv run --no-sync python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-packages --python 3.14
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: The API client matches the backend's OpenAPI document
        run: |
          (cd backend && DJANGO_SETTINGS_MODULE=config.test_settings uv run --no-sync python manage.py \
            export_openapi_schema --api config.api.api --indent 2 --output ../frontend/openapi.json)
          (cd frontend && npm run generate:api)
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: Tests
        working-directory: frontend
        run: npm test
      # Each run on one worker: six runs with the default pool are more processes than the runner's four cores and memory
      # take, and the load, not the worker count, is what this step is for.
      - name: Six runs at once (a test that passes alone and fails under load fails here)
        working-directory: frontend
        run: |
          pids=(); for i in 1 2 3 4 5 6; do npm test -- --maxWorkers=1 > "run-$i.log" 2>&1 & pids+=($!); done
          failed=0; for p in "${pids[@]}"; do wait "$p" || failed=1; done
          grep -h -E "^ +Tests " run-*.log || true
          if [[ $failed != 0 ]]; then
            grep -h -E "^ FAIL " run-*.log | sort -u || true
            for f in run-*.log; do echo "== $f"; tail -n 25 "$f"; done
            exit 1
          fi
      - name: The six runs' logs, when one failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-parallel-runs
          path: frontend/run-*.log
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nurse-roster-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
